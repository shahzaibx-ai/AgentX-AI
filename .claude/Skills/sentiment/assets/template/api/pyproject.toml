[project]
name = "sentiment-studio-api"
version = "1.0.0"
description = "Sentiment analysis API: PyTorch + Hugging Face Transformers behind FastAPI."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "numpy==1.26.4",
    "transformers==4.57.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "ASYNC"]
ignore = ["PT018"]  # compound assertions read fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore:Using `httpx` with `starlette.testclient`"]
