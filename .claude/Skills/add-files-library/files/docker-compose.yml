services:
  api:
    build: ./api
    env_file: ./api/.env
    environment:
      # Reach Ollama running on the host machine
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      CORS_ORIGINS: '["http://localhost:3000"]'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Library and chat files (originals + index records) survive rebuilds
      - library:/app/data/library
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Voice mode (LiveKit). Start with:  docker compose --profile voice up --build
  # Needs LIVEKIT_* in both api/.env and agent/.env (same LiveKit Cloud project).
  agent:
    build: ./agent
    profiles: ["voice"]
    env_file:
      - path: ./agent/.env
        required: false
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/')"]
      interval: 30s
      timeout: 3s
      start_period: 20s
    restart: unless-stopped

  # Optional: run Ollama in Docker instead of on the host.
  #   docker compose --profile ollama up
  #   then set OLLAMA_HOST=http://ollama:11434
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  ollama:
  library:
